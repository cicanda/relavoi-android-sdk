name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate wrapper
        # gradle-wrapper.jar is intentionally not committed (binary). The setup-gradle
        # action provides the gradle CLI we use to materialize the wrapper jar.
        #
        # --no-validate-url because the validation is a HEAD request to
        # services.gradle.org, and on 9 November 2026 that endpoint answered 504
        # to HEAD while answering GET perfectly well. It failed two runs in a
        # row on a commit that touched one KDoc comment and three README lines.
        #
        # Nothing is lost by skipping it. The validation asks whether the
        # distribution is fetchable; the very next step runs ./gradlew, which
        # fetches it over GET and fails loudly if it is genuinely not there. All
        # the probe added was a third party's HEAD endpoint on the critical path
        # of every build in this repository, checking something the next line
        # checks for real.
        run: gradle wrapper --gradle-version 8.7 --no-validate-url

      - name: Build SDK (release)
        run: ./gradlew :relavoi-sdk:assembleRelease

      - name: Run SDK unit tests
        run: ./gradlew :relavoi-sdk:test

      - name: Build sample app (debug)
        run: ./gradlew :sample-app:assembleDebug

      - name: README kotlin samples compile
        # Every ```kotlin fence in the README is compiled against this working
        # tree, in the doc-samples module. A sample an integrator could not
        # compile fails the build.
        #
        # The fence annotations are what make this possible: a reference
        # listing and a two-line snippet cannot be compiled the same way as a
        # whole file. They are documented in scripts/doc-samples/README.md.
        #
        # The docs site's Android pages hold most of the samples and are not in
        # this repository. relavoi-docs runs this same script over them on a
        # schedule, with this SDK checked out at its released tag, because that
        # is the version a reader of the docs is using.
        run: python3 scripts/check-doc-samples.py README.md
